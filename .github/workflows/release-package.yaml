name: Build release artifacts
on: workflow_dispatch
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: 'false'
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: encftr
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: encftr
          extra-packages: any::roxygen2
          needs: check
      - run: Rscript encftr/scripts/check-release.R
      - name: Build Windows binary from checked source
        working-directory: artifacts/encftr-release/package
        run: |
          New-Item -ItemType Directory -Force binary-library | Out-Null
          R CMD INSTALL --build --library=binary-library encftr_0.10.0.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: encftr-0.10.0-release
          path: |
            artifacts/encftr-release/package/*.tar.gz
            artifacts/encftr-release/package/*.zip
            artifacts/encftr-release/package/encftr.Rcheck/00check.log
