name: R-CMD-check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: 'false'
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: encftr
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: encftr
          extra-packages: any::roxygen2
          needs: check
      - name: Check declared dictionary dependency
        run: stopifnot(packageVersion('labeler') >= '0.11.0')
        shell: Rscript {0}
      - run: Rscript encftr/scripts/check-release.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encftr-check-${{ matrix.os }}
          path: artifacts/encftr-release/package
